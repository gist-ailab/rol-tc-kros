    <div class="empty-state">

      <div class="es-desc">첫 워크샵이 준비 중입니다. 워크샵이 종료되면 이 목록에 회차별 기록이 쌓입니다.</div>

    <!--
    ────────────────────────────────────────────────────────────────
    회차 추가 방법
    새 워크샵이 열리면 아래 연도 블록(.year-block)을 위 빈 상태 대신 붙여 넣고,
    카드(.workshop-card)의 href·회차·날짜·장소를 실제 값으로 채우세요.
    각 회차 상세 페이지는 workshops/<연도>/<회차>/index.html 관례로 만듭니다.
    (예: workshops/2026/1st/index.html)
    ────────────────────────────────────────────────────────────────

    <div class="year-block" style="margin-bottom:44px;">
      <div class="year-label" style="font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;">2026</div>
      <div class="workshop-grid">

        <a class="workshop-card" href="2026/1st/index.html">
          <div class="card-top">
            <span class="card-num">2026 · 1st</span>
            <span class="card-badge">완료</span>
          </div>
          <div class="card-title">제1회 워크샵</div>
          <div class="card-meta">
            <span>📅 2026.00.00</span>
            <span>📍 장소</span>
          </div>
        </a>

      </div>
    </div>
