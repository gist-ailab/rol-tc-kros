<!-- 구글 포토 갤러리 플레이어 스크립트 (pa-gallery-player-widget 임베드용, 페이지에 한 번만 로드) -->
<script src="https://cdn.jsdelivr.net/npm/publicalbum@latest/embed-ui.min.js" async></script>

<!-- 회차별 서브탭 전환 스크립트 (패널이 없으면 아무 일도 하지 않고 종료합니다) -->
<script>
  (function () {
    function initSubtabs() {
      var buttons = Array.prototype.slice.call(document.querySelectorAll('.subtab-btn'));
      var panels = Array.prototype.slice.call(document.querySelectorAll('.subtab-panel'));
      if (buttons.length === 0 || panels.length === 0) return;

      function activate(key) {
        buttons.forEach(function (btn) {
          btn.classList.toggle('active', btn.getAttribute('data-subtab') === key);
        });
        panels.forEach(function (panel) {
          panel.hidden = panel.getAttribute('data-panel') !== key;
        });
      }

      buttons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          activate(btn.getAttribute('data-subtab'));
        });
      });

      activate(buttons[0].getAttribute('data-subtab'));
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSubtabs);
    } else {
      initSubtabs();
    }
  })();
</script>
